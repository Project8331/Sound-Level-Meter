<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Noise Monitoring System architecture</title>
  <desc id="desc">Six ESP32 microphone transmitters send readings by ESP-NOW Long Range channel 1 to an ESP32 receiver. The receiver adds its local microphone reading and forwards seven values to a CYD display with RTC and microSD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121e30"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#58d8c6"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #edf4fb; }
      .muted { fill: #a9bbce; }
      .small { font-size: 16px; }
      .node { fill: #18283a; stroke: #36506b; stroke-width: 2; }
      .accent { fill: #58d8c6; }
      .wireless { stroke: #58d8c6; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .wired { stroke: #91a7bc; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" font-size="30" font-weight="700">ESP32 NOISE MONITORING SYSTEM</text>
  <text x="600" y="88" text-anchor="middle" class="muted" font-size="17">6 titik transmitter • 1 receiver agregator • CYD display &amp; logger</text>

  <rect x="45" y="125" width="340" height="450" rx="22" class="node"/>
  <text x="215" y="164" text-anchor="middle" font-size="22" font-weight="700">TITIK PENGUKURAN</text>
  <text x="215" y="190" text-anchor="middle" class="muted small">Enam node ESP32 + INMP441</text>
  <g font-size="16">
    <rect x="75" y="218" width="125" height="72" rx="12" fill="#21364a"/>
    <text x="137" y="247" text-anchor="middle" font-weight="700">P1</text><text x="137" y="271" text-anchor="middle" class="muted">ESP32 + mic</text>
    <rect x="230" y="218" width="125" height="72" rx="12" fill="#21364a"/>
    <text x="292" y="247" text-anchor="middle" font-weight="700">P2</text><text x="292" y="271" text-anchor="middle" class="muted">ESP32 + mic</text>
    <rect x="75" y="312" width="125" height="72" rx="12" fill="#21364a"/>
    <text x="137" y="341" text-anchor="middle" font-weight="700">P3</text><text x="137" y="365" text-anchor="middle" class="muted">ESP32 + mic</text>
    <rect x="230" y="312" width="125" height="72" rx="12" fill="#21364a"/>
    <text x="292" y="341" text-anchor="middle" font-weight="700">P4</text><text x="292" y="365" text-anchor="middle" class="muted">ESP32 + mic</text>
    <rect x="75" y="406" width="125" height="72" rx="12" fill="#21364a"/>
    <text x="137" y="435" text-anchor="middle" font-weight="700">P5</text><text x="137" y="459" text-anchor="middle" class="muted">ESP32 + mic</text>
    <rect x="230" y="406" width="125" height="72" rx="12" fill="#21364a"/>
    <text x="292" y="435" text-anchor="middle" font-weight="700">P6</text><text x="292" y="459" text-anchor="middle" class="muted">ESP32 + mic</text>
  </g>
  <text x="215" y="526" text-anchor="middle" class="accent small" font-weight="700">1 nilai float / node</text>
  <text x="215" y="550" text-anchor="middle" class="muted small">ESP-NOW Long Range • channel 1</text>

  <path d="M385 350H470" class="wireless"/>
  <text x="428" y="326" text-anchor="middle" class="accent small">ESP-NOW</text>

  <rect x="475" y="205" width="270" height="290" rx="22" class="node"/>
  <text x="610" y="247" text-anchor="middle" font-size="22" font-weight="700">ESP32 RECEIVER</text>
  <text x="610" y="278" text-anchor="middle" class="muted">Agregator + mic lokal</text>
  <rect x="515" y="303" width="190" height="58" rx="12" fill="#21364a"/>
  <text x="610" y="328" text-anchor="middle" font-weight="700">I2S 16 kHz / 32-bit</text>
  <text x="610" y="349" text-anchor="middle" class="muted small">dBA (A-weighting) + dB(Z)</text>
  <rect x="515" y="378" width="190" height="70" rx="12" fill="#21364a"/>
  <text x="610" y="407" text-anchor="middle" font-weight="700">Agregasi 7 kanal</text>
  <text x="610" y="432" text-anchor="middle" class="muted small">P1–P6 + mic Receiver</text>
  <text x="610" y="473" text-anchor="middle" class="accent small">Paket agregat tiap 1 detik</text>

  <path d="M745 350H820" class="wireless"/>
  <text x="782" y="326" text-anchor="middle" class="accent small">7 × float</text>

  <rect x="825" y="175" width="330" height="350" rx="22" class="node"/>
  <text x="990" y="218" text-anchor="middle" font-size="22" font-weight="700">CYD ESP32</text>
  <text x="990" y="247" text-anchor="middle" class="muted">Display • RTC • microSD</text>
  <rect x="865" y="276" width="250" height="78" rx="14" fill="#21364a"/>
  <text x="990" y="308" text-anchor="middle" font-weight="700">LVGL + TFT 320 × 240</text>
  <text x="990" y="334" text-anchor="middle" class="muted small">Tampilan P1–P6 + Receiver</text>
  <rect x="865" y="371" width="118" height="80" rx="14" fill="#21364a"/>
  <text x="924" y="404" text-anchor="middle" font-weight="700">DS3231</text>
  <text x="924" y="430" text-anchor="middle" class="muted small">Timestamp</text>
  <rect x="997" y="371" width="118" height="80" rx="14" fill="#21364a"/>
  <text x="1056" y="404" text-anchor="middle" font-weight="700">microSD</text>
  <text x="1056" y="430" text-anchor="middle" class="muted small">CSV logging</text>
  <text x="990" y="490" text-anchor="middle" class="accent small" font-weight="700">ESP-NOW Long Range • channel 1</text>

  <path d="M75 605H1125" stroke="#30455b" stroke-width="1"/>
  <text x="600" y="630" text-anchor="middle" class="muted small">Kalibrasi terhadap sound-level meter diperlukan untuk hasil akustik yang akurat.</text>
</svg>
